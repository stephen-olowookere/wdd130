<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building A Form </title>
</head>

<body>
    <header>
        <h1> WDD 130 | HTML Form - User Poll </h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend> Contact Information </legend>
                <label for="fullname"> Full Name: </label>
                <input type="text" id="fullname" name="fullname" required><br>

                <label for="useremail"> Email: </label>
                <input type="email" id="useremail" name="useremail" required>
            </fieldset>
            <fieldset>
                <legend> Questions </legend>
                <label for="browser"> What is your favorite internet browser? </label>
                <select name="browser" id="browser">
                    <option value="chrome"> Chrome </option>
                    <option value="firefox"> Firefox </option>
                    <option value="safari"> Safari </option>
                    <option value="edge"> Edge </option>
                    <option value="brave"> Brave </option>
                    <option value="other"> Other </option>
                </select><br>
                <label for="pet"> Do you have a household pet? </label>
                <input type="checkbox" id="pet" name="pet"><br>
                <label for="places"> List the places you have lived? </label>
                <textarea id="places" name="places" rows="4"
                  placeholder="lagos, Ibadan, Ogbomosho,Ogun, Ondo, Abuja, Kogi, Benue"></textarea>
            </fieldset>
            <button type="submit"> Submit Poll </button>
        </form>
    </main>
    <footer> ©2026 | HTML Form - User Poll Activity | Olowookere Stephen </footer>
</body>

</html>
