<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Building A Form </title>
</head>

<body>
    <header>
        <h1> WDD 130 | HTML Form - User Poll </h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend> Contact Information </legend>
                <div class="name">
                    <label for="fullname"> Full Name: </label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="email">
                    <label for="useremail"> Email: </label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>
            <fieldset>
                <legend> Questions </legend>
                <div class="browser">
                    <label for="browser"> What is your favorite internet browser? </label>
                    <select name="browser" id="browser">
                        <option value="chrome"> Chrome </option>
                        <option value="firefox"> Firefox </option>
                        <option value="safari"> Safari </option>
                        <option value="edge"> Edge </option>
                        <option value="brave"> Brave </option>
                        <option value="other"> Other </option>
                    </select>
                </div>
                <div class="pet">
                    <label div="class" for="pet"> Do you have a household pet? </label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="place">
                    <label for="places"> List the places you have lived: </label>
                    <textarea id="places" name="places" rows="4"
                      placeholder="lagos, Ibadan, Ogbomosho,Ogun, Ondo, Abuja, Kogi, Benue"></textarea>
                </div>
            </fieldset>
            <button type="submit"> Submit Poll </button>
        </form>
    </main>
    <footer> ©2026 | HTML Form - User Poll Activity | Olowookere Stephen </footer>
</body>

</html>
