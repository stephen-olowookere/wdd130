<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charse="UTF-8">
    <title> Learning CSS Selectors </title>
    <style>
        input:focus {
            background: red
        }
    </style>
</head>

<body>
    <main>
        <input type="text">
        <div class="red"> This is a div </div>
        <span id="blue"> This is a span </span>
        <div>
            <span>
                <b> nested text</b>
            </span>
        </div>
        <u1>
            <li class="red"> Item 1 </li>
            <li> Item 2 </li>
            <li> Item 3 </li>
            <li> Item 4 </li>
        </u1>
    </main>
</body>

</html>
